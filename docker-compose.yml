x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.16-alpine
    container_name: jeu-chimie-db
    restart: unless-stopped
    command: ["postgres", "-c", "log_connections=on", "-c", "log_min_duration_statement=500"]
    environment:
      POSTGRES_USER: jeu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeu_local_only}
      POSTGRES_DB: jeu_chimie
    volumes:
      - jeu_chimie_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeu -d jeu_chimie"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging: *logging

  jeu-chimie:
    build: .
    container_name: jeu-chimie
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      NODE_ENV: production
      PORT: 4173
      HOST: 0.0.0.0
      DATABASE_URL: postgres://jeu_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD manque dans .env}@postgres:5432/jeu_chimie
      DATABASE_OWNER_URL: postgres://jeu:${POSTGRES_PASSWORD:-jeu_local_only}@postgres:5432/jeu_chimie
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Jeu - chimie}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    logging: *logging

volumes:
  jeu_chimie_pg:
